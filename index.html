          <div class="card"><div class="card-title">Rebounding Leaders</div><table><tr><th>#</th><th>Player</th><th>School</th><th>RPG</th></tr>
            ${[...allP].sort((a, b) => b.stats.rpg - a.stats.rpg).slice(0, 20).map((p, i) => `<tr><td>${i + 1}</td><td>${p.name}</td><td class="text-sm">${p.school}</td><td>${p.stats.rpg}</td></tr>`).join('')}
          </table></div>
          <div class="card"><div class="card-title">Assist Leaders</div><table><tr><th>#</th><th>Player</th><th>School</th><th>APG</th></tr>
            ${[...allP].sort((a, b) => b.stats.apg - a.stats.apg).slice(0, 20).map((p, i) => `<tr><td>${i + 1}</td><td>${p.name}</td><td class="text-sm">${p.school}</td><td>${p.stats.apg}</td></tr>`).join('')}
          </table></div>
          <div class="card"><div class="card-title">Block Leaders</div><table><tr><th>#</th><th>Player</th><th>School</th><th>BPG</th></tr>
            ${[...allP].sort((a, b) => b.stats.bpg - a.stats.bpg).slice(0, 20).map((p, i) => `<tr><td>${i + 1}</td><td>${p.name}</td><td class="text-sm">${p.school}</td><td>${p.stats.bpg}</td></tr>`).join('')}
          </table></div>
        </div>`;
    } else if (tab === 'carousel') {
      content.innerHTML = `<div class="card"><div class="card-title">Coaching Carousel</div>
        <table><tr><th>School</th><th>Coach</th><th>Record</th><th>Conf</th><th>Tier</th></tr>
          ${[...G.programs].sort((a, b) => a.tier - b.tier).map(p => `<tr><td>${p.name}</td><td>${p.coach}</td><td>${p.wins}-${p.losses}</td><td class="text-sm">${p.conferenceAbbrev}</td><td>${p.tier}</td></tr>`).join('')}
        </table></div>`;
    }
  },

  recruitPortalPlayer(id) {
    const portalOpen = G.phase === 'offseason' || G.week === 8;
    if (!portalOpen) { alert('Transfer portal is not currently open.'); return; }
    const p = G.portalPlayers.find(pl => pl.id === id);
    if (!p) return;
    const roster = G.players.filter(pl => pl.school === G.coach.school && !pl.walkOn);
    if (roster.length >= 13) { alert('Roster full (13 scholarship players)'); return; }
    p.school = G.coach.school;
    p.nilContract = p.portalData.nilAsk;
    p.portalData.committed = true;
    delete p.portalData;
    G.players.push(p);
    G.portalPlayers = G.portalPlayers.filter(pl => pl.id !== id);
    GameEngine.addNews(`${p.name} transfers to ${G.coach.school} from the portal!`, 'portal');
    GameEngine.save();
    this.render('portal');

          </div>
        </div>
      </div>`;
  },

  hireComplianceOfficer() {
    G.investigationRisk = Math.max(0, G.investigationRisk - 15);
    GameEngine.addNews('Compliance officer hired — investigation risk reduced.', 'compliance');
    GameEngine.save();
    this.render('investigations');
  },

  // === LEGACY ===
  renderLegacy(el) {
    const hofScore = this.calcHOFScore();
    el.innerHTML = `
      <h2 style="color:var(--navy);" class="mb-16">Legacy Archive</h2>
      <div class="grid-2 mb-16">
        <div class="card">
          <div class="card-title">Career Overview</div>
          <table>
            <tr><td>Coach Name</td><td><strong>${G.coach.name}</strong></td></tr>
            <tr><td>Age</td><td>${G.coach.age}</td></tr>
            <tr><td>Seasons Coached</td><td>${G.season}</td></tr>
            <tr><td>Career Record</td><td>${G.coach.careerWins}-${G.coach.careerLosses} (${G.coach.careerWins + G.coach.careerLosses > 0 ? ((G.coach.careerWins / (G.coach.careerWins + G.coach.careerLosses)) * 100).toFixed(1) : 0}%)</td></tr>
            <tr><td>National Championships</td><td>${G.coach.championships}</td></tr>
            <tr><td>Final Fours</td><td>${G.coach.finalFours}</td></tr>
            <tr><td>Tournament Appearances</td><td>${G.coach.tourneyApps}</td></tr>
            <tr><td>Conference Titles</td><td>${G.coach.confChamps}</td></tr>
            <tr><td>Coach of the Year Awards</td><td>${G.coach.coachOfYear}</td></tr>
            <tr><td>Retirement Age</td><td>${G.coach.retireAge}</td></tr>
          </table>
        </div>
        <div class="card">
          <div class="card-title">Hall of Fame Tracker</div>
          <div class="stat-card">
            <div class="stat-value" style="font-size:48px;color:${hofScore >= 80 ? 'var(--gold)' : hofScore >= 50 ? 'var(--orange)' : 'var(--navy)'};">${hofScore}</div>
            <div class="stat-label">HOF Score (80+ = Inducted)</div>
          </div>
          <div class="progress-bar mt-8" style="height:12px;">
            <div class="progress-fill" style="width:${Math.min(100, hofScore)}%;background:linear-gradient(90deg,var(--orange),var(--gold));"></div>
          </div>
          <div class="mt-16 text-sm">
            <p>Wins contribute: +1 per 20 wins</p>
            <p>Championships: +15 each</p>
            <p>Final Fours: +5 each</p>
            <p>Tourney Apps: +2 each</p>
            <p>Conf Titles: +3 each</p>
            <p>Coach of Year: +5 each</p>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Job History</div>
        <table>
          <tr><th>School</th><th>Season</th><th>Year</th></tr>
          ${G.coach.jobHistory.map(j => `<tr><td>${j.school}</td><td>Season ${j.season}</td><td>${j.year}</td></tr>`).join('')}
        </table>
      </div>
      <div class="card mt-16">
        <div class="card-title">Season Awards</div>
        <div class="scroll-y" style="max-height:300px;">
          <table>
            <tr><th>Season</th><th>Award</th><th>Player</th><th>School</th></tr>
            ${G.awards.map(a => `<tr><td>S${a.season}</td><td>${a.award}</td><td>${a.player}</td><td>${a.school}</td></tr>`).join('')}
          </table>
        </div>
      </div>`;
  },

  calcHOFScore() {
    let score = 0;
    score += Math.floor(G.coach.careerWins / 20);
    score += G.coach.championships * 15;
    score += G.coach.finalFours * 5;
    score += G.coach.tourneyApps * 2;
    score += G.coach.confChamps * 3;
    score += G.coach.coachOfYear * 5;
    const winPct = G.coach.careerWins + G.coach.careerLosses > 0 ? G.coach.careerWins / (G.coach.careerWins + G.coach.careerLosses) : 0;
    score += Math.round(winPct * 20);
    return Math.round(score);
  },

  // === SETTINGS ===
  renderSettings(el) {
    el.innerHTML = `
      <h2 style="color:var(--navy);" class="mb-16">Settings</h2>
      <div class="grid-2">
        <div class="card">
          <div class="card-title">Game Controls</div>
          <div class="mb-8">
            <button class="btn-primary" onclick="GameEngine.save()">Save Game</button>
            <button class="btn-secondary" onclick="GameEngine.load()">Load Game</button>
          </div>
          <div class="mb-8">
            <button class="btn-danger" onclick="if(confirm('Delete all save data?')) GameEngine.deleteSave()">Delete Save & Restart</button>
          </div>
        </div>
        <div class="card">
          <div class="card-title">Game Info</div>
          <div class="text-sm">
            <p>Season: ${G.season} | Year: ${G.year}</p>
            <p>Phase: ${G.phase} | Week: ${G.week}</p>
            <p>Total Players: ${G.players.length}</p>
            <p>Total Programs: ${G.programs.length}</p>
            <p>Save Version: ${G.version}</p>
          </div>
        </div>
      </div>`;
  }
};

// ============================================================
// INITIALIZATION
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  GameEngine.init();
});
</script>
</body>
</html>
