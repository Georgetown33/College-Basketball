<html lang="en">

<title>College Basketball Dynasty Simulator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--orange:#E8601C;--navy:#1B2A4A;--black:#111;--light-gray:#F5F5F5;--mid-gray:#E0E0E0;--dark-gray:#888;--green:#2E7D32;--red:#C62828;--gold:#F9A825;--white:#FFF;}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--white);color:var(--black);min-height:100vh;}
.hidden{display:none!important;}
button{cursor:pointer;font-family:inherit;border:none;padding:8px 16px;border-radius:4px;font-size:14px;transition:all .2s;}
button:hover{opacity:.9;transform:translateY(-1px);}
.btn-primary{background:var(--orange);color:var(--white);font-weight:600;}
.btn-secondary{background:var(--navy);color:var(--white);}
.btn-sm{padding:4px 10px;font-size:12px;}
.btn-danger{background:var(--red);color:var(--white);}
.btn-success{background:var(--green);color:var(--white);}
input,select,textarea{font-family:inherit;padding:8px 12px;border:1px solid var(--mid-gray);border-radius:4px;font-size:14px;background:var(--white);}
input:focus,select:focus{outline:none;border-color:var(--orange);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--navy);color:var(--white);padding:8px 10px;text-align:left;font-weight:600;position:sticky;top:0;}
td{padding:6px 10px;border-bottom:1px solid var(--mid-gray);}
tr:hover{background:rgba(232,96,28,.05);}
.card{background:var(--white);border:1px solid var(--mid-gray);border-radius:8px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.card-title{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;}
.badge-orange{background:rgba(232,96,28,.15);color:var(--orange);}
.badge-navy{background:rgba(27,42,74,.15);color:var(--navy);}
.badge-green{background:rgba(46,125,50,.15);color:var(--green);}
.badge-red{background:rgba(198,40,40,.15);color:var(--red);}
.badge-gold{background:rgba(249,168,37,.15);color:#F57F17;}
.progress-bar{height:8px;background:var(--mid-gray);border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;border-radius:4px;transition:width .3s;}
.star{color:var(--gold);font-size:14px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.flex{display:flex;align-items:center;gap:8px;}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
.text-center{text-align:center;}
.text-sm{font-size:12px;color:var(--dark-gray);}
.text-orange{color:var(--orange);}
.text-navy{color:var(--navy);}
.mt-8{margin-top:8px;}.mt-16{margin-top:16px;}.mb-8{margin-bottom:8px;}.mb-16{margin-bottom:16px;}
.scroll-y{overflow-y:auto;max-height:500px;}

/* Header */
#header{background:var(--navy);color:var(--white);padding:0 20px;height:48px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);}
#header h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;}
#header h1 .logo{color:var(--orange);font-size:22px;}
.header-info{display:flex;gap:16px;font-size:13px;align-items:center;}
.header-info span{display:flex;align-items:center;gap:4px;}

/* Navigation */
#nav{background:var(--white);border-bottom:2px solid var(--mid-gray);padding:0 20px;display:flex;gap:0;overflow-x:auto;position:sticky;top:48px;z-index:99;}
.nav-btn{padding:10px 14px;font-size:13px;font-weight:600;color:var(--dark-gray);background:none;border:none;border-bottom:3px solid transparent;border-radius:0;white-space:nowrap;transition:all .2s;}
.nav-btn:hover{color:var(--navy);background:rgba(27,42,74,.05);transform:none;}
.nav-btn.active{color:var(--orange);border-bottom-color:var(--orange);}

/* Main Content */
#main{padding:20px;max-width:1400px;margin:0 auto;}

/* New Game Wizard */
#wizard{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy) 0%,#2a3f6b 100%);padding:20px;}
.wizard-box{background:var(--white);border-radius:12px;padding:32px;max-width:600px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.3);}
.wizard-box h2{color:var(--navy);font-size:24px;margin-bottom:4px;}
.wizard-box .subtitle{color:var(--dark-gray);margin-bottom:20px;}
.wizard-step{margin-top:16px;}
.wizard-step label{display:block;font-weight:600;color:var(--navy);margin-bottom:4px;font-size:14px;}
.wizard-step input,.wizard-step select{width:100%;margin-bottom:12px;}
.school-option{padding:10px;border:2px solid var(--mid-gray);border-radius:8px;cursor:pointer;margin-bottom:8px;transition:all .2s;}
.school-option:hover,.school-option.selected{border-color:var(--orange);background:rgba(232,96,28,.05);}
.school-option .school-name{font-weight:700;font-size:15px;}
.school-option .school-info{font-size:12px;color:var(--dark-gray);}

/* Dashboard specific */
.stat-card{text-align:center;padding:16px;}
.stat-card .stat-value{font-size:28px;font-weight:700;color:var(--navy);}
.stat-card .stat-label{font-size:12px;color:var(--dark-gray);margin-top:4px;}
.news-item{padding:10px;border-left:3px solid var(--orange);margin-bottom:8px;background:rgba(232,96,28,.03);border-radius:0 4px 4px 0;font-size:13px;}
.news-item .news-week{font-size:11px;color:var(--dark-gray);}
.game-result{padding:8px 12px;border-radius:6px;font-size:13px;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.game-result.win{background:rgba(46,125,50,.08);border-left:3px solid var(--green);}
.game-result.loss{background:rgba(198,40,40,.08);border-left:3px solid var(--red);}

/* Recruiting */
.recruit-card{border:1px solid var(--mid-gray);border-radius:8px;padding:12px;margin-bottom:8px;transition:all .2s;}
.recruit-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.1);}
.interest-bar{height:6px;background:var(--mid-gray);border-radius:3px;margin-top:4px;}
.interest-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--orange),var(--green));}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;}
.modal{background:var(--white);border-radius:12px;padding:24px;max-width:700px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.3);}
.modal h3{color:var(--navy);margin-bottom:12px;}

/* Pitch minigame */
.pitch-option{padding:10px;border:2px solid var(--mid-gray);border-radius:6px;cursor:pointer;margin-bottom:6px;font-size:13px;transition:all .2s;}
.pitch-option:hover{border-color:var(--orange);}
.pitch-option.selected{border-color:var(--orange);background:rgba(232,96,28,.1);}
.pitch-option.correct{border-color:var(--green);background:rgba(46,125,50,.1);}
.pitch-option.wrong{border-color:var(--red);background:rgba(198,40,40,.1);}

/* Depth chart */
.depth-slot{display:inline-block;padding:4px 8px;background:var(--light-gray);border-radius:4px;margin:2px;font-size:12px;cursor:pointer;border:1px solid var(--mid-gray);}
.depth-slot.starter{background:rgba(232,96,28,.15);border-color:var(--orange);font-weight:600;}

/* Bracket */
.bracket-round{display:flex;flex-direction:column;gap:8px;min-width:180px;}
.bracket-game{border:1px solid var(--mid-gray);border-radius:4px;font-size:11px;overflow:hidden;}
.bracket-team{padding:4px 8px;display:flex;justify-content:space-between;}
.bracket-team.winner{background:rgba(46,125,50,.1);font-weight:600;}

/* Responsive */
@media(max-width:768px){
.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}
#nav{gap:0;}
.nav-btn{padding:8px 10px;font-size:12px;}
.header-info{gap:8px;font-size:11px;}
}

/* Tab sub-navigation */
.sub-tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--mid-gray);padding-bottom:0;}
.sub-tab{padding:6px 12px;font-size:12px;font-weight:600;color:var(--dark-gray);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;}
.sub-tab.active{color:var(--orange);border-bottom-color:var(--orange);}
.sub-tab:hover{color:var(--navy);}

/* Tooltip */
.tooltip{position:relative;}
.tooltip:hover::after{content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--black);color:var(--white);padding:4px 8px;border-radius:4px;font-size:11px;white-space:nowrap;z-index:200;}

/* Court background pattern */
.court-bg{background:linear-gradient(135deg,rgba(232,96,28,.02) 25%,transparent 25%) -10px 0,linear-gradient(225deg,rgba(232,96,28,.02) 25%,transparent 25%) -10px 0,linear-gradient(315deg,rgba(232,96,28,.02) 25%,transparent 25%),linear-gradient(45deg,rgba(232,96,28,.02) 25%,transparent 25%);background-size:20px 20px;}
</style>
</head>

const Utils = {
  rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; },
  randFloat(min, max) { return Math.random() * (max - min) + min; },
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  clamp(v, min, max) { return Math.max(min, Math.min(max, v)); },
  weightedRand(weights) { const total = weights.reduce((a, b) => a + b, 0); let r = Math.random() * total; for (let i = 0; i < weights.length; i++) { r -= weights[i]; if (r <= 0) return i; } return weights.length - 1; },
  uuid() { return 'xxxxxxxx-xxxx-xxxx'.replace(/x/g, () => Math.floor(Math.random() * 16).toString(16)); },
  escAttr(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); },
  stars(n) { return '★'.repeat(n) + '☆'.repeat(5 - n); },
  formatMoney(n) { if (n >= 1000000) return '$' + (n / 1000000).toFixed(1) + 'M'; if (n >= 1000) return '$' + (n / 1000).toFixed(0) + 'K'; return '$' + n; },
  gaussRand(mean, std) { let u = 0, v = 0; while (u === 0) u = Math.random(); while (v === 0) v = Math.random(); return Math.round(mean + std * Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v)); },
  ordinal(n) { const s = ["th", "st", "nd", "rd"]; const v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
};

const PlayerEngine = {
  positionWeights: {
    PG: { scoring: .12, playmaking: .18, defense: .10, athleticism: .10, basketballIQ: .15, rebounding: .03, threePoint: .10, postGame: .02, ballHandling: .18, leadership: .02 },
    SG: { scoring: .18, playmaking: .10, defense: .12, athleticism: .12, basketballIQ: .10, rebounding: .05, threePoint: .15, postGame: .03, ballHandling: .10, leadership: .05 },
    SF: { scoring: .15, playmaking: .08, defense: .14, athleticism: .14, basketballIQ: .10, rebounding: .10, threePoint: .10, postGame: .05, ballHandling: .08, leadership: .06 },
    PF: { scoring: .12, playmaking: .05, defense: .14, athleticism: .12, basketballIQ: .08, rebounding: .18, threePoint: .05, postGame: .15, ballHandling: .03, leadership: .08 },
    C:  { scoring: .10, playmaking: .03, defense: .15, athleticism: .10, basketballIQ: .08, rebounding: .20, threePoint: .02, postGame: .20, ballHandling: .02, leadership: .10 }
  },

  calcOverall(p) {
    const w = this.positionWeights[p.position];
    let ovr = 0;
    for (const [attr, weight] of Object.entries(w)) {
      ovr += (p.attributes[attr] || 50) * weight;
    }
    return Math.round(ovr);
  },

  generatePlayer(opts = {}) {
    const starRating = opts.stars || this.rollStarRating();
    const position = opts.position || Utils.pick(POSITIONS);
    const archetype = opts.archetype || this.pickArchetype(position);
    const year = opts.year || 'Freshman';
    const isIntl = opts.international || false;
    const hometown = opts.hometown || (isIntl ? Utils.pick(HOMETOWNS.slice(40)) : Utils.pick(HOMETOWNS.slice(0, 40)));

    const baseAttr = this.baseFromStars(starRating);
    const attrs = {};
    const attrNames = ['scoring','playmaking','defense','athleticism','basketballIQ','rebounding','threePoint','postGame','ballHandling','leadership'];
    const archBonus = this.archetypeBonus(archetype);

    for (const a of attrNames) {
      attrs[a] = Utils.clamp(baseAttr + Utils.rand(-12, 12) + (archBonus[a] || 0) + this.yearBonus(year) * Utils.rand(1, 4), 15, 99);
    }

    const potential = Utils.clamp(baseAttr + Utils.rand(5, 30), 40, 99);
    const devCurve = Utils.pick(DEV_CURVES);
    const personality = Utils.pick(PERSONALITIES);

    const player = {
      id: Utils.uuid(),
      name: NameGen.gen(),
      hometown,
      starRating,
      position,
      archetype,
      attributes: attrs,
      potential,
      devCurve,
      personality,
      year,
      yearNum: this.yearToNum(year),
      eligibilityLeft: 4 - this.yearToNum(year) + 1,
      redshirt: false,
      redshirtUsed: false,
      medicalRedshirt: false,
      morale: 70,
      nilContract: 0,
      nilMarketValue: this.calcMarketValue(starRating, attrs),
      school: opts.school || '',
      international: isIntl,
      intlAdjustment: isIntl ? 1 : 0,
      walkOn: opts.walkOn || false,
      stats: this.emptyStats(),
      careerStats: this.emptyStats(),
      overall: 0,
      injured: false,
      injuryWeeks: 0,
      socialFollowing: starRating * Utils.rand(5000, 30000),
      draftStock: 0,
      gamesPlayed: 0,
      minutesPerGame: 0
    };
    player.overall = this.calcOverall(player);
    return player;
  },

  emptyStats() {
    return { gp: 0, mpg: 0, ppg: 0, rpg: 0, apg: 0, spg: 0, bpg: 0, fgPct: 0, threePct: 0, ftPct: 0, plusMinus: 0, totalPts: 0, totalReb: 0, totalAst: 0, totalStl: 0, totalBlk: 0, totalMin: 0, totalFgm: 0, totalFga: 0, totalThm: 0, totalTha: 0, totalFtm: 0, totalFta: 0 };
  },

  rollStarRating() {
    const r = Math.random();
    if (r < .05) return 5;
    if (r < .20) return 4;
    if (r < .60) return 3;
    if (r < .90) return 2;
    return 1;
  },

  baseFromStars(s) { return [30, 38, 50, 62, 75][s - 1]; },

  yearToNum(y) { return { 'Freshman': 1, 'Sophomore': 2, 'Junior': 3, 'Senior': 4, 'Graduate': 4 }[y] || 1; },
  numToYear(n) { return ['Freshman','Sophomore','Junior','Senior','Graduate'][Math.min(n-1, 4)] || 'Freshman'; },

  yearBonus(y) { return { 'Freshman': 0, 'Sophomore': 1, 'Junior': 2, 'Senior': 3, 'Graduate': 3 }[y] || 0; },

  pickArchetype(pos) {
    const map = {
      PG: ['Floor General', 'Scoring Guard', 'Playmaker', 'Two-Way Star'],
      SG: ['Scoring Guard', '3-and-D Wing', 'Slasher', 'Two-Way Star'],
      SF: ['3-and-D Wing', 'Slasher', 'Two-Way Star', 'Energy/Role Player'],
      PF: ['Stretch Big', 'Workhorse Big', 'Rim Protector', 'Energy/Role Player'],
      C: ['Rim Protector', 'Workhorse Big', 'Stretch Big', 'Energy/Role Player']
    };
    return Utils.pick(map[pos] || ARCHETYPES);
  },

  archetypeBonus(arch) {
    const bonuses = {
      'Scoring Guard': { scoring: 12, threePoint: 8, ballHandling: 5 },
      '3-and-D Wing': { threePoint: 12, defense: 10 },
      'Playmaker': { playmaking: 15, ballHandling: 10, basketballIQ: 5 },
      'Stretch Big': { threePoint: 12, scoring: 5, postGame: -5 },
      'Rim Protector': { defense: 15, rebounding: 10, postGame: 5, threePoint: -10 },
      'Slasher': { athleticism: 12, scoring: 8, threePoint: -5 },
      'Floor General': { playmaking: 12, basketballIQ: 12, leadership: 8 },
      'Workhorse Big': { rebounding: 12, postGame: 10, defense: 5 },
      'Energy/Role Player': { defense: 5, rebounding: 5, athleticism: 5 },
      'Two-Way Star': { scoring: 8, defense: 8, athleticism: 5 }
    };
    return bonuses[arch] || {};
  },

  calcMarketValue(stars, attrs) {
    const base = [5000, 20000, 80000, 250000, 700000][stars - 1];
    const attrAvg = Object.values(attrs).reduce((a, b) => a + b, 0) / Object.values(attrs).length;
    return Math.round(base * (attrAvg / 55));
  },

  developPlayer(player, coachDev, facilityBonus, teamSuccess) {
    if (player.injured) return;
    const devRate = (coachDev / 100) * 0.3 + 0.7;
    let curveMultiplier = 1.0;
    if (player.devCurve === 'Early Bloomer') curveMultiplier = player.yearNum <= 2 ? 1.4 : 0.7;
    else if (player.devCurve === 'Late Bloomer') curveMultiplier = player.yearNum >= 3 ? 1.5 : 0.6;

    const personalityBonus = player.personality === 'Gym Rat' ? 1.2 : 1.0;
    const totalMult = devRate * curveMultiplier * personalityBonus * (1 + facilityBonus / 100);
    const ceiling = player.potential;

    for (const attr of Object.keys(player.attributes)) {
      if (player.attributes[attr] < ceiling) {
        const gain = Utils.randFloat(0.5, 2.5) * totalMult;
        player.attributes[attr] = Utils.clamp(Math.round(player.attributes[attr] + gain), player.attributes[attr], ceiling);
      }
    }
    player.overall = this.calcOverall(player);
    player.nilMarketValue = this.calcMarketValue(player.starRating, player.attributes);
  },

  advanceYear(player) {
    player.yearNum++;
    player.eligibilityLeft--;
    player.year = this.numToYear(player.yearNum);
    player.stats = this.emptyStats();
    if (player.international && player.intlAdjustment > 0) player.intlAdjustment = 0;
  },

  willDeclareForDraft(player) {
    if (player.yearNum < 2) return false;
    const draftProb = (player.overall - 65) * 3 + (player.starRating - 3) * 10;
    if (player.personality === 'Loyal') return Math.random() * 100 < draftProb * 0.5;
    return Math.random() * 100 < draftProb;
  },

  willTransfer(player, nilSatisfaction, playingTime, teamSuccess, coachRel) {
    const morale = this.calcMorale(nilSatisfaction, playingTime, teamSuccess, coachRel, player.overall);
    if (player.personality === 'Loyal') return morale < 25;
    if (player.personality === 'Transferable') return morale < 55;
    return morale < 35;
  },

  calcMorale(nilSat, playTime, teamSuccess, coachRel, devProgress) {
    return Utils.clamp(Math.round(nilSat * 0.30 + playTime * 0.25 + teamSuccess * 0.20 + coachRel * 0.15 + devProgress * 0.10), 0, 100);
  }
};

// RECRUITING ENGINE
// ============================================================
const RecruitingEngine = {
  generateRecruitClass(season) {
    const recruits = [];
    const starDist = { 5: 15, 4: 50, 3: 150, 2: 120, 1: 65 };
    for (const [stars, count] of Object.entries(starDist)) {
      for (let i = 0; i < count; i++) {
        const intl = Math.random() < 0.04;
        const pos = Utils.pick(POSITIONS);
        const r = PlayerEngine.generatePlayer({ stars: parseInt(stars), position: pos, international: intl });
        r.id = 'rec-' + Utils.uuid();
        r.school = '';
        r.recruitingData = {
          topSchools: [],
          priorities: Utils.shuffle(RECRUIT_PRIORITIES).slice(0, 3),
          interest: {},
          committed: false,
          committedTo: '',
          decisionWeek: Utils.rand(8, 28),
          visited: {},
          nilSensitivity: Utils.rand(20, 90),
          academicReq: Utils.rand(40, 90),
          radiusPref: Utils.rand(200, 1200),
          contactWeeks: {}
        };
        recruits.push(r);
      }
    }
    return recruits;
  },

  assignTopSchools(recruits, programs) {
    for (const r of recruits) {
      const eligible = programs.filter(p => {
        if (r.recruitingData.academicReq > 70 && p.academic < 70) return false;
        return true;
      });
      const scored = eligible.map(p => {
        let score = (6 - p.tier) * 20 + Utils.rand(0, 30);
        if (r.recruitingData.priorities.includes('NIL')) score += (p.nilBudget / 500000) * 5;
        if (r.recruitingData.priorities.includes('Prestige')) score += (6 - p.tier) * 10;
        if (r.recruitingData.priorities.includes('Academics')) score += (p.academic / 10);
        return { prog: p, score };
      });
      scored.sort((a, b) => b.score - a.score);
      r.recruitingData.topSchools = scored.slice(0, Utils.rand(5, 8)).map(s => s.prog.name);
      for (const s of r.recruitingData.topSchools) {
        r.recruitingData.interest[s] = Utils.rand(20, 50);
      }
    }
  },

  doRecruitAction(recruit, school, action, coachSkill, program) {
    if (!recruit.recruitingData.interest[school] && recruit.recruitingData.interest[school] !== 0) {
      recruit.recruitingData.interest[school] = 5;
    }
    const base = recruit.recruitingData.interest[school];
    let gain = 0;
    switch (action) {
      case 'offer': gain = 5; if (!recruit.recruitingData.topSchools.includes(school)) recruit.recruitingData.topSchools.push(school); break;
      case 'homeVisit': gain = Utils.rand(8, 18) * (coachSkill / 70); break;
      case 'campusVisit': gain = Utils.rand(10, 20) * (coachSkill / 70); break;
      case 'call': gain = Utils.rand(3, 8) * (coachSkill / 80); break;
      case 'nilPitch': gain = Utils.rand(5, 15) * (recruit.recruitingData.nilSensitivity / 60); break;
      case 'academicPitch': gain = Utils.rand(3, 10) * (program.academic / 70); break;
    }
    recruit.recruitingData.interest[school] = Utils.clamp(Math.round(base + gain), 0, 100);
    recruit.recruitingData.contactWeeks[school] = G.week;
    if (recruit.recruitingData.interest[school] >= 100) {
      this.commitRecruit(recruit, school);
    }
  },

  commitRecruit(recruit, school) {
    recruit.recruitingData.committed = true;
    recruit.recruitingData.committedTo = school;
    GameEngine.addNews(`${recruit.starRating}-star ${recruit.position} ${recruit.name} commits to ${school}!`, 'recruiting');
  },

  decayInterest(recruits, week) {
    for (const r of recruits) {
      if (r.recruitingData.committed) continue;
      for (const school of Object.keys(r.recruitingData.interest)) {
        const lastContact = r.recruitingData.contactWeeks[school] || 0;
        if (week - lastContact >= 3 && r.recruitingData.interest[school] > 10) {
          r.recruitingData.interest[school] = Math.max(5, r.recruitingData.interest[school] - 5);
        }
      }
    }
  },

  aiRecruit(programs, recruits, week) {
    for (const prog of programs) {
      if (prog.name === G.coach.school) continue;
      const roster = G.players.filter(p => p.school === prog.name && !p.walkOn);
      if (roster.length >= 13) continue;
      const targets = recruits.filter(r => !r.recruitingData.committed && r.recruitingData.topSchools.includes(prog.name));
      for (const t of targets.slice(0, 5)) {
        const gain = Utils.rand(4, 14) * ((6 - prog.tier) / 3);
        t.recruitingData.interest[prog.name] = Utils.clamp((t.recruitingData.interest[prog.name] || 15) + gain, 0, 100);
        t.recruitingData.contactWeeks[prog.name] = week;
        if (t.recruitingData.interest[prog.name] >= 70 && Math.random() < 0.4) {
          this.commitRecruit(t, prog.name);
        }
      }
    }
  },

  signRecruits(recruits, programs) {
    // Auto-commit undecided recruits to their top interest school
    for (const r of recruits) {
      if (r.recruitingData.committed) continue;
      let bestSchool = '', bestInt = 0;
      for (const [school, interest] of Object.entries(r.recruitingData.interest)) {
        if (interest > bestInt) { bestInt = interest; bestSchool = school; }
      }
      if (bestSchool && bestInt >= 20) {
        r.recruitingData.committed = true;
        r.recruitingData.committedTo = bestSchool;
      }
    }
    // Convert committed recruits to players
    const signed = [];
    for (const r of recruits) {
      if (!r.recruitingData.committed) continue;
      const school = r.recruitingData.committedTo;
      const roster = G.players.filter(p => p.school === school && !p.walkOn);
      if (roster.length >= 13) continue;
      const player = { ...r, school, year: 'Freshman', yearNum: 1, eligibilityLeft: 4, stats: PlayerEngine.emptyStats(), id: Utils.uuid() };
      delete player.recruitingData;
      G.players.push(player);
      signed.push(player);
    }
    return signed;
  }
};

// ============================================================
// NIL ENGINE
// ============================================================
const NILEngine = {
  calcBudget(program) {
    const base = program.nilBudget;
    const donorMult = 1 + (program.fanSentiment - 50) / 100;
    const carryover = Math.min((program.nilCarryover || 0), base * 2);
    const donorEvents = program.nilDonorBonus || 0;
    const collectiveHub = [1, 1.15, 1.3, 1.5][program.facilities?.nilHub || 0];
    return Math.round((base * donorMult * collectiveHub) + carryover + donorEvents);
  },

  calcSpending(school) {
    return G.players.filter(p => p.school === school).reduce((sum, p) => sum + (p.nilContract || 0), 0);
  },

  calcCarryover(program) {
    const budget = this.calcBudget(program);
    const spent = this.calcSpending(program.name);
    const unused = Math.max(0, budget - spent);
    return Math.min(Math.round(unused * 0.4), program.nilBudget * 2);
  },

  getNILSatisfaction(player) {
    if (player.nilMarketValue <= 0) return 80;
    const ratio = player.nilContract / player.nilMarketValue;
    if (ratio >= 1.2) return 95;
    if (ratio >= 0.9) return 80;
    if (ratio >= 0.6) return 55;
    if (ratio >= 0.3) return 30;
    return 10;
  },

  autoAssignNIL(school) {
    const prog = G.programs.find(p => p.name === school);
    if (!prog) return;
    const budget = this.calcBudget(prog);
    const roster = G.players.filter(p => p.school === school && !p.walkOn);
    roster.sort((a, b) => b.overall - a.overall);
    let remaining = budget;
    for (const p of roster) {
      const alloc = Math.min(Math.round(p.nilMarketValue * 0.85), Math.round(remaining / Math.max(1, roster.indexOf(p) === roster.length - 1 ? 1 : (roster.length - roster.indexOf(p)))));
      p.nilContract = Math.max(0, alloc);
      remaining -= p.nilContract;
    }
  }
};

// ============================================================
// SIMULATION ENGINE
// ============================================================
const SimEngine = {
  teamRating(school) {
    const roster = G.players.filter(p => p.school === school && !p.injured);
    if (roster.length === 0) return 30;
    roster.sort((a, b) => b.overall - a.overall);
    const top8 = roster.slice(0, Math.min(8, roster.length));
    const avg = top8.reduce((s, p) => s + p.overall, 0) / top8.length;
    const depth = Math.min(roster.length / 10, 1) * 5;
    const morale = top8.reduce((s, p) => s + p.morale, 0) / top8.length / 20;
    return Math.round(avg + depth + morale);
  },

  simulateGame(homeSchool, awaySchool, neutral = false) {
    const homeRating = this.teamRating(homeSchool);
    const awayRating = this.teamRating(awaySchool);
    const homeProg = G.programs.find(p => p.name === homeSchool);
    const awayProg = G.programs.find(p => p.name === awaySchool);

    let homeAdv = neutral ? 0 : 3;
    if (homeProg && homeProg.facilities) {
      homeAdv += (homeProg.facilities.stadium || 0) * 0.5;
    }

    // Coach bonuses
    let homeCoachBonus = 0, awayCoachBonus = 0;
    if (homeSchool === G.coach.school) homeCoachBonus = G.coach.skills.gameStrategy / 20;
    if (awaySchool === G.coach.school) awayCoachBonus = G.coach.skills.gameStrategy / 20;

    // Scheme bonuses
    if (homeSchool === G.coach.school) homeCoachBonus += G.coach.skills.offenseMastery / 30 + G.coach.skills.defenseMastery / 30;
    if (awaySchool === G.coach.school) awayCoachBonus += G.coach.skills.offenseMastery / 30 + G.coach.skills.defenseMastery / 30;

    const homePower = homeRating + homeAdv + homeCoachBonus + Utils.randFloat(-8, 8);
    const awayPower = awayRating + awayCoachBonus + Utils.randFloat(-8, 8);

    const homeWin = homePower > awayPower;
    const diff = Math.abs(homePower - awayPower);
    const basePts = Utils.rand(60, 85);
    const homeScore = homeWin ? basePts + Utils.rand(0, Math.round(diff * 1.5)) : basePts - Utils.rand(0, Math.round(diff));
    const awayScore = homeWin ? basePts - Utils.rand(0, Math.round(diff)) : basePts + Utils.rand(0, Math.round(diff * 1.5));

    // Ensure no ties
    const finalHome = Math.max(40, homeScore);
    let finalAway = Math.max(40, awayScore);
    if (finalHome === finalAway) finalAway += homeWin ? -1 : 1;

    // Generate box scores for involved players
    const homeBox = this.generateBoxScore(homeSchool, finalHome);
    const awayBox = this.generateBoxScore(awaySchool, finalAway);

    return {
      home: homeSchool, away: awaySchool,
      homeScore: homeWin ? Math.max(finalHome, finalAway) : Math.min(finalHome, finalAway),
      awayScore: homeWin ? Math.min(finalHome, finalAway) : Math.max(finalHome, finalAway),
      homeWin, neutral,
      homeBox, awayBox,
      week: G.week
    };
  },

  generateBoxScore(school, teamScore) {
    const roster = G.players.filter(p => p.school === school && !p.injured);
    if (roster.length === 0) return [];
    roster.sort((a, b) => b.overall - a.overall);
    const playing = roster.slice(0, Math.min(10, roster.length));
    const totalMinutes = 200;
    let minutePool = totalMinutes;
    const box = [];

    for (let i = 0; i < playing.length; i++) {
      const p = playing[i];
      const minShare = i < 5 ? Utils.rand(28, 38) : Utils.rand(5, 20);
      const mins = Math.min(minShare, minutePool);
      minutePool -= mins;

      const scoringAbility = (p.attributes.scoring + p.attributes.threePoint * 0.3) / 130;
      const shareOfScore = (scoringAbility * mins / totalMinutes);
      const pts = Math.max(0, Math.round(teamScore * shareOfScore * Utils.randFloat(0.5, 2.0)));

      const fga = Math.max(1, Math.round(pts / Utils.randFloat(0.35, 0.55)));
      const fgm = Math.min(fga, Math.round(pts * 0.45));
      const tha = Math.round(fga * (p.attributes.threePoint / 200));
      const thm = Math.min(tha, Math.round(tha * (p.attributes.threePoint / 150)));
      const fta = Utils.rand(0, Math.round(pts * 0.3));
      const ftm = Math.min(fta, Math.round(fta * Utils.randFloat(0.6, 0.9)));
      const reb = Math.round((p.attributes.rebounding / 70) * (mins / 30) * Utils.randFloat(0.5, 2.0));
      const ast = Math.round((p.attributes.playmaking / 80) * (mins / 30) * Utils.randFloat(0.3, 1.8));
      const stl = Math.round((p.attributes.defense / 120) * (mins / 30) * Utils.randFloat(0, 2));
      const blk = Math.round((p.attributes.defense / 130) * (mins / 30) * Utils.randFloat(0, 1.5));

      const intlPenalty = p.international && p.intlAdjustment > 0 ? 0.9 : 1.0;

      const statLine = {
        playerId: p.id, name: p.name, position: p.position,
        min: mins, pts: Math.round(pts * intlPenalty), reb, ast, stl, blk,
        fgm, fga, thm, tha, ftm, fta
      };
      box.push(statLine);

      // Update season stats
      p.stats.gp++;
      p.stats.totalMin += mins;
      p.stats.totalPts += statLine.pts;
      p.stats.totalReb += reb;
      p.stats.totalAst += ast;
      p.stats.totalStl += stl;
      p.stats.totalBlk += blk;
      p.stats.totalFgm += fgm;
      p.stats.totalFga += fga;
      p.stats.totalThm += thm;
      p.stats.totalTha += tha;
      p.stats.totalFtm += ftm;
      p.stats.totalFta += fta;
      if (p.stats.gp > 0) {
        p.stats.ppg = +(p.stats.totalPts / p.stats.gp).toFixed(1);
        p.stats.rpg = +(p.stats.totalReb / p.stats.gp).toFixed(1);
        p.stats.apg = +(p.stats.totalAst / p.stats.gp).toFixed(1);
        p.stats.spg = +(p.stats.totalStl / p.stats.gp).toFixed(1);
        p.stats.bpg = +(p.stats.totalBlk / p.stats.gp).toFixed(1);
        p.stats.mpg = +(p.stats.totalMin / p.stats.gp).toFixed(1);
        p.stats.fgPct = p.stats.totalFga > 0 ? +(p.stats.totalFgm / p.stats.totalFga * 100).toFixed(1) : 0;
        p.stats.threePct = p.stats.totalTha > 0 ? +(p.stats.totalThm / p.stats.totalTha * 100).toFixed(1) : 0;
        p.stats.ftPct = p.stats.totalFta > 0 ? +(p.stats.totalFtm / p.stats.totalFta * 100).toFixed(1) : 0;
      }
    }
    return box;
  },

  generateSchedule(programs) {
    const schedule = [];
    // Conference games: round-robin within conference (each team plays 9 others twice = 18 conf games)
    for (const conf of SchoolData.conferences) {
      const confTeams = programs.filter(p => p.conference === conf.name);
      for (let i = 0; i < confTeams.length; i++) {
        for (let j = i + 1; j < confTeams.length; j++) {
          schedule.push({ home: confTeams[i].name, away: confTeams[j].name, week: Utils.rand(7, 20), type: 'conference', played: false, result: null });
          schedule.push({ home: confTeams[j].name, away: confTeams[i].name, week: Utils.rand(7, 20), type: 'conference', played: false, result: null });
        }
      }
    }
    // Non-conference: each team gets 4 non-conf games in weeks 5-8
    for (const prog of programs) {
      const others = programs.filter(p => p.conference !== prog.conference);
      const opponents = Utils.shuffle(others).slice(0, 4);
      for (let i = 0; i < opponents.length; i++) {
        if (!schedule.find(s => (s.home === prog.name && s.away === opponents[i].name) || (s.home === opponents[i].name && s.away === prog.name && s.type === 'nonconference'))) {
          schedule.push({ home: prog.name, away: opponents[i].name, week: 5 + i, type: 'nonconference', played: false, result: null });
        }
      }
    }
    // Sort by week
    schedule.sort((a, b) => a.week - b.week);
    return schedule;
  },

  simulateWeek() {
    const weekGames = G.schedule.filter(s => s.week === G.week && !s.played);
    const results = [];
    for (const game of weekGames) {
      const result = this.simulateGame(game.home, game.away);
      game.played = true;
      game.result = result;
      results.push(result);
      // Update records
      const hp = G.programs.find(p => p.name === game.home);
      const ap = G.programs.find(p => p.name === game.away);
      if (hp && ap) {
        if (result.homeWin) { hp.wins++; ap.losses++; if (game.type === 'conference') { hp.confWins++; ap.confLosses++; } }
        else { ap.wins++; hp.losses++; if (game.type === 'conference') { ap.confWins++; hp.confLosses++; } }
        if (game.home === G.coach.school) { if (result.homeWin) G.coach.careerWins++; else G.coach.careerLosses++; }
        if (game.away === G.coach.school) { if (!result.homeWin) G.coach.careerWins++; else G.coach.careerLosses++; }
      }
    }
    // Random injury check
    for (const p of G.players) {
      if (!p.injured && Math.random() < 0.005) {
        p.injured = true;
        p.injuryWeeks = Utils.rand(1, 8);
        if (p.school === G.coach.school) GameEngine.addNews(`${p.name} suffers an injury — out ${p.injuryWeeks} weeks`, 'injury');
      } else if (p.injured) {
        p.injuryWeeks--;
        if (p.injuryWeeks <= 0) { p.injured = false; p.injuryWeeks = 0; }
      }
    }
    // Recruiting decay and AI recruiting
    RecruitingEngine.decayInterest(G.recruits, G.week);
    if (G.week >= 5) RecruitingEngine.aiRecruit(G.programs, G.recruits, G.week);
    // Update AP Poll
    this.updateAPPoll();
    G.results.push(...results);
    return results;
  },

  updateAPPoll() {
    const rated = G.programs.map(p => ({
      name: p.name,
      score: (p.wins * 30 - p.losses * 20) + (6 - p.tier) * 10 + SimEngine.teamRating(p.name) * 0.5 + p.prestige * 0.3 + Utils.randFloat(-3, 3)
    }));
    rated.sort((a, b) => b.score - a.score);
    G.apPoll = rated.slice(0, 25).map((r, i) => ({ rank: i + 1, name: r.name, score: r.score }));
  },

  runConferenceTournaments() {
    const brackets = [];
    for (const conf of SchoolData.conferences) {
      const confTeams = G.programs.filter(p => p.conference === conf.name);
      confTeams.sort((a, b) => (b.confWins - b.confLosses) - (a.confWins - a.confLosses) || b.wins - a.wins);
      const bracket = { conference: conf.name, rounds: [], champion: '' };
      // 10-team single elim (top 2 get bye to quarters, seeds 3-10 play first round)
      let remaining = confTeams.map(t => t.name);
      // First round: 8 teams play, 2 get byes
      const byes = remaining.slice(0, 2);
      const firstRound = [];
      for (let i = 2; i < 10; i += 2) {
        if (i + 1 < remaining.length) {
          const r = this.simulateGame(remaining[i], remaining[i + 1], true);
          firstRound.push(r);
          GameEngine.addNews(`${conf.name} Tournament: ${r.homeWin ? r.home : r.away} defeats ${r.homeWin ? r.away : r.home} ${r.homeScore}-${r.awayScore}`, 'tournament');
        }
      }
      bracket.rounds.push(firstRound);
      let quarterTeams = [...byes, ...firstRound.map(r => r.homeWin ? r.home : r.away)];
      // Quarters
      const quarters = [];
      for (let i = 0; i < quarterTeams.length; i += 2) {
        if (i + 1 < quarterTeams.length) {
          const r = this.simulateGame(quarterTeams[i], quarterTeams[i + 1], true);
          quarters.push(r);
        }
      }
      bracket.rounds.push(quarters);
      // Semis
      let semiTeams = quarters.map(r => r.homeWin ? r.home : r.away);
      const semis = [];
      for (let i = 0; i < semiTeams.length; i += 2) {
        if (i + 1 < semiTeams.length) {
          const r = this.simulateGame(semiTeams[i], semiTeams[i + 1], true);
          semis.push(r);
        }
      }
      bracket.rounds.push(semis);
      // Final
      let finalTeams = semis.map(r => r.homeWin ? r.home : r.away);
      if (finalTeams.length >= 2) {
        const final = this.simulateGame(finalTeams[0], finalTeams[1], true);
        bracket.rounds.push([final]);
        bracket.champion = final.homeWin ? final.home : final.away;
        const champ = G.programs.find(p => p.name === bracket.champion);
        if (champ) { champ.confChampionships = (champ.confChampionships || 0) + 1; }
        if (bracket.champion === G.coach.school) { G.coach.confChamps++; }
        GameEngine.addNews(`${bracket.champion} wins the ${conf.name} Tournament Championship!`, 'tournament');
      }
      brackets.push(bracket);
    }
    G.confTourneyBrackets = brackets;
    return brackets;
  },

  selectNCAATournamentField() {
    const field = [];
    // Auto-bids from conference champions
    for (const b of G.confTourneyBrackets) {
      if (b.champion) field.push({ name: b.champion, seed: 0, autobid: true });
    }
    // At-large: fill remaining 54 spots
    const remaining = G.programs.filter(p => !field.find(f => f.name === p.name))
      .map(p => ({ name: p.name, score: p.wins * 3 - p.losses * 2 + (6 - p.tier) * 2 + SimEngine.teamRating(p.name) * 0.2 }))
      .sort((a, b) => b.score - a.score);
    for (let i = 0; i < 54 && i < remaining.length; i++) {
      field.push({ name: remaining[i].name, seed: 0, autobid: false });
    }
    // Assign seeds 1-16 across 4 regions
    field.sort((a, b) => {
      const pa = G.programs.find(p => p.name === a.name);
      const pb = G.programs.find(p => p.name === b.name);
      return (pb.wins - pb.losses) - (pa.wins - pa.losses);
    });
    for (let i = 0; i < field.length; i++) {
      field[i].seed = Math.floor(i / 4) + 1;
    }
    return field;
  },

  runNCAATournament(field) {
    const regions = ['East', 'West', 'South', 'Midwest'];
    const bracket = { regions: {}, finalFour: [], championship: null, champion: '' };

    // Split into 4 regions of 16
    for (let r = 0; r < 4; r++) {
      const regionTeams = [];
      for (let s = 0; s < 16; s++) {
        const idx = s * 4 + r;
        if (idx < field.length) regionTeams.push(field[idx]);
      }
      // Standard bracket: 1v16, 8v9, 5v12, 4v13, 6v11, 3v14, 7v10, 2v15
      const order = [0, 15, 7, 8, 4, 11, 3, 12, 5, 10, 2, 13, 6, 9, 1, 14];
      const ordered = order.map(i => regionTeams[i]).filter(Boolean);

      let current = ordered.map(t => t.name);
      const rounds = [];

      while (current.length > 1) {
        const roundResults = [];
        for (let i = 0; i < current.length; i += 2) {
          if (i + 1 < current.length) {
            const result = this.simulateGame(current[i], current[i + 1], true);
            roundResults.push(result);
            const winner = result.homeWin ? result.home : result.away;
            const loser = result.homeWin ? result.away : result.home;
            GameEngine.addNews(`NCAA Tournament: ${winner} defeats ${loser} ${result.homeScore}-${result.awayScore}`, 'ncaa');
            // Tournament appearances tracked in advanceWeek
          }
        }
        rounds.push(roundResults);
        current = roundResults.map(r => r.homeWin ? r.home : r.away);
      }
      bracket.regions[regions[r]] = { teams: ordered, rounds, winner: current[0] };
    }

    // Final Four
    const ff = regions.map(r => bracket.regions[r].winner);
    const semi1 = this.simulateGame(ff[0], ff[1], true);
    const semi2 = this.simulateGame(ff[2], ff[3], true);
    bracket.finalFour = [semi1, semi2];
    GameEngine.addNews(`Final Four: ${semi1.homeWin ? semi1.home : semi1.away} advances!`, 'ncaa');
    GameEngine.addNews(`Final Four: ${semi2.homeWin ? semi2.home : semi2.away} advances!`, 'ncaa');

    // Track Final Four for coach
    if ([ff[0], ff[1], ff[2], ff[3]].includes(G.coach.school)) G.coach.finalFours++;

    // Championship
    const champ1 = semi1.homeWin ? semi1.home : semi1.away;
    const champ2 = semi2.homeWin ? semi2.home : semi2.away;
    const championship = this.simulateGame(champ1, champ2, true);
    bracket.championship = championship;
    bracket.champion = championship.homeWin ? championship.home : championship.away;

    if (bracket.champion === G.coach.school) G.coach.championships++;
    const champProg = G.programs.find(p => p.name === bracket.champion);
    if (champProg) champProg.championships = (champProg.championships || 0) + 1;

    GameEngine.addNews(`${bracket.champion} wins the National Championship!`, 'ncaa');
    G.ncaaBracket = bracket;
    return bracket;
  }
};

// ============================================================
// GAME ENGINE (Core loop, save/load, initialization)
// ============================================================
const GameEngine = {
  init() {
    const saved = localStorage.getItem('cbdynasty_save');
    if (saved) {
      try {
        G = JSON.parse(saved);
        this.showGame();
        UIEngine.init();
        return;
      } catch (e) { console.error('Save corrupted', e); }
    }
    this.showWizard();
  },

  save() {
    localStorage.setItem('cbdynasty_save', JSON.stringify(G));
  },

  load() {
    const saved = localStorage.getItem('cbdynasty_save');
    if (saved) { G = JSON.parse(saved); UIEngine.init(); UIEngine.render('dashboard'); }
  },

  deleteSave() {
    localStorage.removeItem('cbdynasty_save');
    location.reload();
  },

  addNews(text, type = 'general') {
    G.news.unshift({ text, type, week: G.week, season: G.season });
    if (G.news.length > 200) G.news.length = 200;
  },

  showWizard() {
    document.getElementById('wizard').classList.remove('hidden');
    document.getElementById('game-container').classList.add('hidden');
    WizardUI.render();
  },

  showGame() {
    document.getElementById('wizard').classList.add('hidden');
    document.getElementById('game-container').classList.remove('hidden');
  },

  startNewGame(coachName, difficulty, schoolName, offense, defense) {
    G = newGameState();
    G.coach.name = coachName;
    G.difficulty = difficulty;
    G.coach.school = schoolName;
    G.coach.offenseStyle = offense;
    G.coach.defenseStyle = defense;

    // Skills based on difficulty
    const skillBase = difficulty === 'easy' ? 40 : difficulty === 'medium' ? 30 : 20;
    for (const k of Object.keys(G.coach.skills)) G.coach.skills[k] = skillBase + Utils.rand(-5, 10);
    G.coach.skills.reputation = difficulty === 'easy' ? 35 : difficulty === 'medium' ? 20 : 10;

    // Initialize programs
    this.initPrograms();

    // Generate initial rosters for all programs
    this.generateAllRosters();

    // Generate recruit class
    G.recruits = RecruitingEngine.generateRecruitClass(1);
    RecruitingEngine.assignTopSchools(G.recruits, G.programs);

    // Generate schedule
    G.schedule = SimEngine.generateSchedule(G.programs);

    // Generate assistants for user
    this.generateAssistants(schoolName);

    // NIL auto-assign for all AI programs
    for (const p of G.programs) {
      if (p.name !== G.coach.school) NILEngine.autoAssignNIL(p.name);
    }

    // Initial AP Poll
    SimEngine.updateAPPoll();

    // Job history
    G.coach.jobHistory.push({ school: schoolName, season: 1, year: G.year });
    G.coach.yearsAtSchool = 0;

    this.addNews(`${coachName} hired as head coach at ${schoolName}!`, 'coaching');
    this.addNews(`Season ${G.season} begins. ${G.programs.length} programs compete for glory.`, 'general');

    this.save();
    this.showGame();
    UIEngine.init();
  },

  initPrograms() {
    G.programs = SchoolData.schools.map(s => ({
      name: s.name,
      tier: s.tier,
      conference: SchoolData.conferences[s.conf].name,
      conferenceAbbrev: SchoolData.conferences[s.conf].abbrev,
      nilBudget: s.budget,
      nilCarryover: 0,
      nilDonorBonus: 0,
      recruitingRadius: s.radius,
      stadiumCapacity: s.stadium,
      academic: s.academic,
      rival: s.rival,
      prestige: (6 - s.tier) * 20,
      wins: 0, losses: 0,
      confWins: 0, confLosses: 0,
      totalWins: 0, totalLosses: 0,
      championships: 0,
      confChampionships: 0,
      tourneyAppearances: 0,
      fanSentiment: 50 + (6 - s.tier) * 5,
      facilities: { practice: s.tier <= 2 ? 2 : s.tier <= 3 ? 1 : 0, filmRoom: s.tier <= 2 ? 1 : 0, recruitingLounge: s.tier <= 2 ? 2 : s.tier <= 3 ? 1 : 0, nilHub: s.tier <= 2 ? 2 : s.tier <= 3 ? 1 : 0, stadium: s.tier <= 2 ? 2 : s.tier <= 3 ? 1 : 0 },
      coach: s.name === G.coach.school ? G.coach.name : NameGen.genCoachName(),
      coachSkill: s.name === G.coach.school ? 0 : Utils.rand(30, 80),
      assistants: [],
      investigationRisk: 0
    }));
  },

  generateAllRosters() {
    for (const prog of G.programs) {
      const rosterSize = Utils.rand(10, 13);
      const starPool = prog.tier === 1 ? [3,3,4,4,4,5,5,3,3,4,4,3,3] :
                        prog.tier === 2 ? [2,3,3,3,4,4,3,3,2,3,3,2,3] :
                        prog.tier === 3 ? [1,2,2,3,3,3,2,2,2,3,2,2,1] :
                        prog.tier === 4 ? [1,1,2,2,2,3,2,1,2,2,1,1,2] :
                                          [1,1,1,2,2,2,1,1,1,2,1,1,1];
      for (let i = 0; i < rosterSize; i++) {
        const stars = starPool[i % starPool.length];
        const yearNum = Utils.rand(1, 4);
        const p = PlayerEngine.generatePlayer({
          stars, school: prog.name,
          year: PlayerEngine.numToYear(yearNum),
          position: POSITIONS[i % 5]
        });
        p.yearNum = yearNum;
        p.eligibilityLeft = 5 - yearNum;
        p.year = PlayerEngine.numToYear(yearNum);
        G.players.push(p);
      }
      // Add 2-3 walk-ons
      const walkOns = Utils.rand(2, 3);
      for (let i = 0; i < walkOns; i++) {
        const wo = PlayerEngine.generatePlayer({ stars: 1, school: prog.name, walkOn: true, year: PlayerEngine.numToYear(Utils.rand(1, 4)) });
        wo.walkOn = true;
        wo.potential = Math.random() < 0.05 ? Utils.rand(65, 85) : Utils.rand(25, 45);
        G.players.push(wo);
      }
    }
  },

  generateAssistants(school) {
    const prog = G.programs.find(p => p.name === school);
    if (!prog) return;
    prog.assistants = [];
    for (let i = 0; i < 3; i++) {
      prog.assistants.push({
        id: Utils.uuid(),
        name: NameGen.genCoachName(),
        role: ['Recruiting Coordinator', 'Player Development Coach', 'Offensive/Defensive Coordinator'][i],
        skills: { recruiting: Utils.rand(25, 65), development: Utils.rand(25, 65), schemeKnowledge: Utils.rand(25, 65), charisma: Utils.rand(30, 70), loyalty: Utils.rand(30, 80) },
        ambition: Utils.rand(20, 80),
        salary: Utils.rand(50000, 200000),
        yearsWithTeam: 0
      });
    }
  },

  advanceWeek() {
    if (G.phase === 'preseason') {
      if (G.week < 4) {
        G.week++;
        this.addNews(`Preseason Week ${G.week}: Teams prepare for the upcoming season.`, 'general');
      } else {
        G.phase = 'regular';
        G.week = 5;
        this.addNews('The regular season begins!', 'general');
      }
    } else if (G.phase === 'regular') {
      const results = SimEngine.simulateWeek();
      // Generate headlines for user's games
      for (const r of results) {
        if (r.home === G.coach.school || r.away === G.coach.school) {
          const isHome = r.home === G.coach.school;
          const won = (isHome && r.homeWin) || (!isHome && !r.homeWin);
          const opp = isHome ? r.away : r.home;
          const myScore = isHome ? r.homeScore : r.awayScore;
          const oppScore = isHome ? r.awayScore : r.homeScore;
          this.addNews(`${won ? 'WIN' : 'LOSS'}: ${G.coach.school} ${myScore} - ${opp} ${oppScore}`, won ? 'win' : 'loss');
        }
      }
      G.week++;
      if (G.week > 20) {
        G.phase = 'confTourney';
        G.week = 21;
        this.addNews('Conference tournament week begins!', 'tournament');
      }
      // Transfer portal December window
      if (G.week === 8) {
        this.addNews('December transfer portal window opens.', 'portal');
        this.generatePortalPlayers(20);
      }
    } else if (G.phase === 'confTourney') {
      if (G.week === 21) {
        SimEngine.runConferenceTournaments();
        G.week = 24;
        G.phase = 'ncaaTourney';
        const field = SimEngine.selectNCAATournamentField();
        const userIn = field.find(f => f.name === G.coach.school);
        if (userIn) {
          this.addNews(`${G.coach.school} earns a ${Utils.ordinal(userIn.seed)} seed in the NCAA Tournament!`, 'ncaa');
          G.coach.tourneyApps++;
        } else {
          this.addNews(`${G.coach.school} did not make the NCAA Tournament field.`, 'ncaa');
        }
        G.ncaaBracket = { field };
      }
    } else if (G.phase === 'ncaaTourney') {
      if (!G.ncaaBracket.champion) {
        const field = G.ncaaBracket.field || SimEngine.selectNCAATournamentField();
        SimEngine.runNCAATournament(field);
      }
      G.phase = 'offseason';
      G.offseasonStep = 0;
      G.week = 30;
      this.addNews('The season is over. Offseason begins.', 'general');
    } else if (G.phase === 'offseason') {
      this.processOffseasonStep();
    }
    // Update player morale
    this.updatePlayerMorale();
    // Check NIL compliance
    const myProg = G.programs.find(p => p.name === G.coach.school);
    if (myProg) {
      const nilBudget = NILEngine.calcBudget(myProg);
      const nilSpent = NILEngine.calcSpending(G.coach.school);
      if (nilSpent > nilBudget) G.investigationRisk = Math.min(100, G.investigationRisk + 2);
    }
    this.save();
    UIEngine.render(UIEngine.currentScreen);
  },

  updatePlayerMorale() {
    const myPlayers = G.players.filter(p => p.school === G.coach.school);
    const prog = G.programs.find(p => p.name === G.coach.school);
    const teamSuccess = prog ? Math.min(100, (prog.wins / Math.max(1, prog.wins + prog.losses)) * 100) : 50;
    for (const p of myPlayers) {
      const nilSat = NILEngine.getNILSatisfaction(p);
      const playTime = p.stats.mpg > 25 ? 85 : p.stats.mpg > 15 ? 65 : p.stats.mpg > 5 ? 40 : 20;
      const coachRel = G.coach.skills.motivator;
      const devProgress = p.overall;
      p.morale = PlayerEngine.calcMorale(nilSat, playTime, teamSuccess, coachRel, devProgress);
    }
  },

  generatePortalPlayers(count) {
    for (let i = 0; i < count; i++) {
      const p = PlayerEngine.generatePlayer({ stars: Utils.rand(1, 4), year: PlayerEngine.numToYear(Utils.rand(2, 4)) });
      p.id = 'portal-' + Utils.uuid();
      p.previousSchool = Utils.pick(G.programs).name;
      p.portalData = {
        nilAsk: Math.round(p.nilMarketValue * Utils.randFloat(1.5, 3.0)),
        decisionWeek: G.week + Utils.rand(1, 3),
        interest: {},
        committed: false
      };
      G.portalPlayers.push(p);
    }
  },

  processOffseasonStep() {
    const steps = [
      'awards', 'draft', 'portal', 'coaching_carousel', 'signing_day',
      'nil_reset', 'facilities', 'skill_points', 'preview'
    ];
    if (G.offseasonStep >= steps.length) {
      this.startNewSeason();
      return;
    }
    const step = steps[G.offseasonStep];
    switch (step) {
      case 'awards': this.processAwards(); break;
      case 'draft': this.processDraftDeclarations(); break;
      case 'portal': this.processTransferPortal(); break;
      case 'coaching_carousel': this.processCoachingCarousel(); break;
      case 'signing_day': this.processSigningDay(); break;
      case 'nil_reset': this.processNILReset(); break;
      case 'facilities': this.processFacilities(); break;
      case 'skill_points': this.processSkillPoints(); break;
      case 'preview': this.processPreview(); break;
    }
    G.offseasonStep++;
    this.save();
    UIEngine.render('dashboard');
  },

  processAwards() {
    // Player of the Year
    const allPlayers = G.players.filter(p => p.stats.gp > 5);
    allPlayers.sort((a, b) => b.stats.ppg - a.stats.ppg);
    if (allPlayers.length > 0) {
      const poy = allPlayers[0];
      this.addNews(`Player of the Year: ${poy.name} (${poy.school}) — ${poy.stats.ppg} PPG`, 'award');
      G.awards.push({ season: G.season, award: 'Player of the Year', player: poy.name, school: poy.school });
    }
    // Coach of the Year
    const coaches = G.programs.map(p => ({ name: p.coach, school: p.name, wins: p.wins })).sort((a, b) => b.wins - a.wins);
    if (coaches.length > 0) {
      this.addNews(`Coach of the Year: ${coaches[0].name} (${coaches[0].school})`, 'award');
      if (coaches[0].school === G.coach.school) G.coach.coachOfYear++;
    }
    // All-American teams
    const topPlayers = allPlayers.slice(0, 15);
    for (let i = 0; i < Math.min(5, topPlayers.length); i++) {
      G.awards.push({ season: G.season, award: 'First Team All-American', player: topPlayers[i].name, school: topPlayers[i].school });
    }
    this.addNews('End-of-season awards announced.', 'award');
  },

  processDraftDeclarations() {
    const declared = [];
    for (const p of [...G.players]) {
      if (PlayerEngine.willDeclareForDraft(p)) {
        declared.push(p);
        this.addNews(`${p.name} (${p.school}) declares for the NBA Draft`, 'draft');
        G.players = G.players.filter(pl => pl.id !== p.id);
      }
    }
    // Graduate/exhaust eligibility
    for (const p of [...G.players]) {
      if (p.eligibilityLeft <= 0) {
        this.addNews(`${p.name} (${p.school}) graduates — eligibility exhausted`, 'general');
        G.players = G.players.filter(pl => pl.id !== p.id);
      }
    }
  },

  processTransferPortal() {
    // Players enter portal
    this.generatePortalPlayers(Utils.rand(80, 120));
    // AI teams also lose some players
    const toRemove = [];
    for (const prog of G.programs) {
      if (prog.name === G.coach.school) continue;
      const roster = G.players.filter(p => p.school === prog.name && !p.walkOn);
      for (const p of roster) {
        if (Math.random() < 0.08) {
          p.previousSchool = p.school;
          p.school = '';
          p.portalData = { nilAsk: Math.round(p.nilMarketValue * 1.8), decisionWeek: G.week + 2, interest: {}, committed: false };
          G.portalPlayers.push(p);
          toRemove.push(p.id);
        }
      }
    }
    G.players = G.players.filter(p => !toRemove.includes(p.id));
    // AI teams pick up portal players
    for (const pp of G.portalPlayers) {
      if (pp.portalData?.committed) continue;
      if (Math.random() < 0.4) {
        const dest = Utils.pick(G.programs.filter(p => p.name !== pp.previousSchool));
        pp.school = dest.name;
        if (pp.portalData) pp.portalData.committed = true;
        G.players.push(pp);
      }
    }
    this.addNews('Transfer portal activity concludes.', 'portal');
  },

  processCoachingCarousel() {
    for (const prog of G.programs) {
      if (prog.name === G.coach.school) continue;
      // Fire underperformers
      const expectedWins = prog.tier === 1 ? 18 : prog.tier === 2 ? 14 : prog.tier === 3 ? 10 : prog.tier === 4 ? 6 : 3;
      if (prog.wins < expectedWins - 5 && Math.random() < 0.4) {
        this.addNews(`${prog.coach} fired at ${prog.name} after a ${prog.wins}-${prog.losses} season.`, 'coaching');
        prog.coach = NameGen.genCoachName();
        prog.coachSkill = Utils.rand(30, 70);
      }
    }
  },

  processSigningDay() {
    const signed = RecruitingEngine.signRecruits(G.recruits, G.programs);
    this.addNews(`Signing Day: ${signed.length} recruits signed across all programs.`, 'recruiting');
    // Count user's class
    const myClass = signed.filter(p => p.school === G.coach.school);
    if (myClass.length > 0) {
      this.addNews(`${G.coach.school} signs ${myClass.length} recruits.`, 'recruiting');
    }
  },

  processNILReset() {
    for (const prog of G.programs) {
      prog.nilCarryover = NILEngine.calcCarryover(prog);
      prog.nilDonorBonus = 0;
      // Adjust based on season performance
      if (prog.wins > 20) prog.nilDonorBonus += Utils.rand(50000, 200000);
      if (prog.name === G.ncaaBracket?.champion) prog.nilDonorBonus += Utils.rand(500000, 1000000);
    }
    // Auto-assign for AI
    for (const p of G.programs) {
      if (p.name !== G.coach.school) NILEngine.autoAssignNIL(p.name);
    }
    this.addNews('NIL budgets reset for the new season.', 'nil');
  },

  processFacilities() {
    // AI upgrades facilities randomly
    for (const prog of G.programs) {
      if (prog.name === G.coach.school) continue;
      if (Math.random() < 0.1) {
        const cats = ['practice', 'filmRoom', 'recruitingLounge', 'nilHub', 'stadium'];
        const cat = Utils.pick(cats);
        if (prog.facilities[cat] < 3) prog.facilities[cat]++;
      }
    }
  },

  processSkillPoints() {
    const prog = G.programs.find(p => p.name === G.coach.school);
    let points = 2; // Base
    if (prog) {
      if (prog.wins >= 20) points += 2;
      else if (prog.wins >= 15) points += 1;
      if (G.ncaaBracket?.champion === G.coach.school) points += 3; // Just won championship
    }
    G.coach.skillPoints += points;
    G.coach.age++;
    G.coach.yearsAtSchool++;
    this.addNews(`You earned ${points} skill points. You now have ${G.coach.skillPoints} to allocate.`, 'coaching');

    // Develop players offseason
    const facilityBonus = (prog?.facilities?.practice || 0) * 5;
    for (const p of G.players.filter(pl => pl.school === G.coach.school)) {
      PlayerEngine.developPlayer(p, G.coach.skills.playerDev, facilityBonus, prog?.wins || 0);
      PlayerEngine.advanceYear(p);
    }
    // AI develop and advance
    for (const p of G.players.filter(pl => pl.school !== G.coach.school)) {
      PlayerEngine.developPlayer(p, 50, 5, 10);
      PlayerEngine.advanceYear(p);
    }
    // Remove players with exhausted eligibility
    const exhausted = G.players.filter(p => p.eligibilityLeft <= 0);
    for (const p of exhausted) {
      if (p.school === G.coach.school) this.addNews(`${p.name} has exhausted eligibility and departs.`, 'general');
    }
    G.players = G.players.filter(p => p.eligibilityLeft > 0);
  },

  processPreview() {
    // Reset records
    for (const p of G.programs) { p.wins = 0; p.losses = 0; p.confWins = 0; p.confLosses = 0; }
    // Ensure all programs have minimum roster (fill with walk-ons/generated players)
    for (const prog of G.programs) {
      let roster = G.players.filter(p => p.school === prog.name);
      while (roster.length < 8) {
        const fill = PlayerEngine.generatePlayer({
          stars: Utils.rand(1, Math.max(1, 4 - prog.tier)),
          school: prog.name,
          year: PlayerEngine.numToYear(Utils.rand(1, 3)),
          position: POSITIONS[roster.length % 5]
        });
        G.players.push(fill);
        roster = G.players.filter(p => p.school === prog.name);
      }
    }
    // Generate new recruits
    G.recruits = RecruitingEngine.generateRecruitClass(G.season + 1);
    RecruitingEngine.assignTopSchools(G.recruits, G.programs);
    G.portalPlayers = [];
    // Generate new schedule
    G.schedule = SimEngine.generateSchedule(G.programs);
    G.results = [];
    G.ncaaBracket = null;
    G.confTourneyBrackets = [];
    SimEngine.updateAPPoll();
    this.addNews(`Preseason AP Poll released for Season ${G.season + 1}.`, 'general');
  },

  startNewSeason() {
    G.season++;
    G.year++;
    G.week = 1;
    G.phase = 'preseason';
    G.offseasonStep = 0;
    this.addNews(`Welcome to Season ${G.season} (${G.year}-${G.year + 1})!`, 'general');
    this.save();
    UIEngine.render('dashboard');
  },

  getMyRecord() {
    const prog = G.programs.find(p => p.name === G.coach.school);
    return prog ? `${prog.wins}-${prog.losses}` : '0-0';
  },

  getMyRank() {
    const entry = G.apPoll.find(e => e.name === G.coach.school);
    return entry ? `#${entry.rank}` : 'NR';
  }
};

// WIZARD UI
// ============================================================
const WizardUI = {
  step: 0,
  data: { name: '', difficulty: 'medium', school: '', offense: '', defense: '' },

  render() {
    const el = document.getElementById('wizard-content');
    if (this.step === 0) this.renderStep1(el);
    else if (this.step === 1) this.renderStep2(el);
    else if (this.step === 2) this.renderStep3(el);
    else if (this.step === 3) this.renderStep4(el);
  },

  renderStep1(el) {
    el.innerHTML = `
      <div class="wizard-step">
        <label>Coach Name</label>
        <input type="text" id="wiz-name" placeholder="Enter your name" value="${this.data.name}">
        <label>Difficulty</label>
        <select id="wiz-diff">
          <option value="easy" ${this.data.difficulty==='easy'?'selected':''}>Easy (Tier 1 School)</option>
          <option value="medium" ${this.data.difficulty==='medium'?'selected':''}>Medium (Tier 2-3 School)</option>
          <option value="hard" ${this.data.difficulty==='hard'?'selected':''}>Hard (Tier 4-5 School)</option>
        </select>
        <button class="btn-primary" onclick="WizardUI.nextStep()" style="width:100%;margin-top:12px;">Next</button>
      </div>`;
  },

  renderStep2(el) {
    const tierRange = this.data.difficulty === 'easy' ? [1, 1] : this.data.difficulty === 'medium' ? [2, 3] : [4, 5];
    const schools = SchoolData.schools.filter(s => s.tier >= tierRange[0] && s.tier <= tierRange[1]);
    el.innerHTML = `
      <div class="wizard-step">
        <label>Choose Your School</label>
        <div style="max-height:350px;overflow-y:auto;">
          ${schools.map(s => `
            <div class="school-option ${this.data.school === s.name ? 'selected' : ''}" onclick="WizardUI.selectSchool('${Utils.escAttr(s.name)}')">
              <div class="school-name">${s.name}</div>
              <div class="school-info">Tier ${s.tier} | ${SchoolData.conferences[s.conf].name} | Budget: ${Utils.formatMoney(s.budget)} | Academics: ${s.academic}</div>
            </div>
          `).join('')}
        </div>
        <div class="flex-between mt-8">
          <button class="btn-secondary" onclick="WizardUI.prevStep()">Back</button>
          <button class="btn-primary" onclick="WizardUI.nextStep()" ${!this.data.school?'disabled':''}>Next</button>
        </div>
      </div>`;
  },

  renderStep3(el) {
    el.innerHTML = `
      <div class="wizard-step">
        <label>Offensive System</label>
        ${OFFENSE_STYLES.map(o => `
          <div class="school-option ${this.data.offense === o.name ? 'selected' : ''}" onclick="WizardUI.selectOffense('${Utils.escAttr(o.name)}')">
            <div class="school-name">${o.name}</div>
            <div class="school-info">${o.desc}</div>
          </div>
        `).join('')}
        <label class="mt-8">Defensive System</label>
        ${DEFENSE_STYLES.map(d => `
          <div class="school-option ${this.data.defense === d.name ? 'selected' : ''}" onclick="WizardUI.selectDefense('${Utils.escAttr(d.name)}')">
            <div class="school-name">${d.name}</div>
            <div class="school-info">${d.desc}</div>
          </div>
        `).join('')}
        <div class="flex-between mt-8">
          <button class="btn-secondary" onclick="WizardUI.prevStep()">Back</button>
          <button class="btn-primary" onclick="WizardUI.nextStep()" ${!this.data.offense||!this.data.defense?'disabled':''}>Next</button>
        </div>
      </div>`;
  },

  renderStep4(el) {
    const school = SchoolData.schools.find(s => s.name === this.data.school);
    el.innerHTML = `
      <div class="wizard-step">
        <h3 style="color:var(--navy);">Confirm Your Career</h3>
        <div class="card">
          <p><strong>Coach:</strong> ${this.data.name}</p>
          <p><strong>School:</strong> ${this.data.school} (Tier ${school?.tier})</p>
          <p><strong>Conference:</strong> ${SchoolData.conferences[school?.conf || 0].name}</p>
          <p><strong>NIL Budget:</strong> ${Utils.formatMoney(school?.budget || 0)}</p>
          <p><strong>Offense:</strong> ${this.data.offense}</p>
          <p><strong>Defense:</strong> ${this.data.defense}</p>
          <p><strong>Difficulty:</strong> ${this.data.difficulty}</p>
        </div>
        <div class="flex-between mt-8">
          <button class="btn-secondary" onclick="WizardUI.prevStep()">Back</button>
          <button class="btn-primary" onclick="WizardUI.startGame()" style="padding:12px 32px;font-size:16px;">Start Dynasty</button>
        </div>
      </div>`;
  },

  nextStep() {
    if (this.step === 0) {
      this.data.name = document.getElementById('wiz-name').value || 'Coach Smith';
      this.data.difficulty = document.getElementById('wiz-diff').value;
    }
    if (this.step === 1 && !this.data.school) return;
    if (this.step === 2 && (!this.data.offense || !this.data.defense)) return;
    this.step++;
    this.render();
  },

  prevStep() { this.step--; this.render(); },
  selectSchool(name) { this.data.school = name; this.render(); },
  selectOffense(name) { this.data.offense = name; this.render(); },
  selectDefense(name) { this.data.defense = name; this.render(); },

  startGame() {
    GameEngine.startNewGame(this.data.name, this.data.difficulty, this.data.school, this.data.offense, this.data.defense);
  }
};

// ============================================================
// UI ENGINE
// ============================================================
const UIEngine = {
  currentScreen: 'dashboard',
  screens: ['dashboard', 'team', 'recruiting', 'nil', 'staff', 'facilities', 'schedule', 'national', 'portal', 'rivals', 'investigations', 'legacy', 'settings'],
  screenLabels: ['Dashboard', 'My Team', 'Recruiting', 'NIL Budget', 'Staff', 'Facilities', 'Schedule', 'National', 'Portal', 'Rivals', 'Investigations', 'Legacy', 'Settings'],

  init() {
    this.renderNav();
    this.updateHeader();
    this.render('dashboard');
  },

  renderNav() {
    const nav = document.getElementById('nav');
    nav.innerHTML = this.screens.map((s, i) =>
      `<button class="nav-btn ${s === this.currentScreen ? 'active' : ''}" onclick="UIEngine.render('${s}')">${this.screenLabels[i]}</button>`
    ).join('');
  },

  updateHeader() {
    document.getElementById('header-school').textContent = G.coach.school;
    document.getElementById('header-record').textContent = GameEngine.getMyRecord();
    document.getElementById('header-season').textContent = `S${G.season} (${G.year})`;
    document.getElementById('header-week').textContent = `Wk ${G.week}`;
    document.getElementById('header-rank').textContent = GameEngine.getMyRank();
  },

  render(screen) {
    this.currentScreen = screen;
    this.renderNav();
    this.updateHeader();
    const main = document.getElementById('main');
    switch (screen) {
      case 'dashboard': this.renderDashboard(main); break;
      case 'team': this.renderTeam(main); break;
      case 'recruiting': this.renderRecruiting(main); break;
      case 'nil': this.renderNIL(main); break;
      case 'staff': this.renderStaff(main); break;
      case 'facilities': this.renderFacilities(main); break;
      case 'schedule': this.renderSchedule(main); break;
      case 'national': this.renderNational(main); break;
      case 'portal': this.renderPortal(main); break;

            <div class="card-title">News Feed</div>
            <div class="scroll-y" style="max-height:300px;">
              ${G.news.slice(0, 20).map(n => `<div class="news-item"><div class="news-week">S${n.season} Wk${n.week}</div>${n.text}</div>`).join('')}

    document.getElementById('team-content').innerHTML = `
      <div class="scroll-y" style="max-height:600px;">

  renderDepthChart() {
    const roster = G.players.filter(p => p.school === G.coach.school && !p.injured).sort((a, b) => b.overall - a.overall);

    for (const pos of POSITIONS) byPos[pos] = roster.filter(p => p.position === pos);

    document.getElementById('team-content').innerHTML = `
      <div class="card">
        <div class="card-title">Depth Chart</div>
        ${POSITIONS.map(pos => `
          <div class="mb-8">
            <strong>${pos}</strong>
            <div class="flex" style="flex-wrap:wrap;">
              ${(byPos[pos] || []).map((p, i) => `
                <span class="depth-slot ${i === 0 ? 'starter' : ''}">${p.name} (${p.overall})</span>
              `).join('')}
            </div>
          </div>
        `).join('')}
      </div>`;
    document.querySelectorAll('.sub-tab').forEach((t, i) => t.classList.toggle('active', i === 2));
  },

          </div>
          <div class="flex mt-16" style="gap:8px;">

          </div>
        </div>
      </div>`;

  redshirtPlayer(id) {
    const p = G.players.find(pl => pl.id === id);
    if (p) { p.redshirt = true; p.redshirtUsed = true; p.eligibilityLeft++; GameEngine.addNews(`${p.name} has been redshirted.`, 'general'); }
    document.getElementById('modal-root').innerHTML = '';
    GameEngine.save();
    this.render('team');
  },

  adjustNIL(id) {
    const p = G.players.find(pl => pl.id === id);
    if (!p) return;
    const newVal = prompt(`Adjust NIL for ${p.name}\nCurrent: ${Utils.formatMoney(p.nilContract)}\nMarket Value: ${Utils.formatMoney(p.nilMarketValue)}\n\nEnter new NIL amount:`, p.nilContract);
    if (newVal !== null && !isNaN(newVal)) {
      p.nilContract = Math.max(0, parseInt(newVal));
      GameEngine.save();
      this.showPlayerDetail(id);
    }
  },

  // === RECRUITING ===
  renderRecruiting(el) {
    const uncommitted = G.recruits.filter(r => !r.recruitingData.committed).sort((a, b) => b.starRating - a.starRating || b.overall - a.overall);
    const myTargets = G.recruits.filter(r => r.recruitingData.interest[G.coach.school] !== undefined);
    const committed = G.recruits.filter(r => r.recruitingData.committedTo === G.coach.school);

  showRecruitTab(tab) {
    document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
    document.getElementById(`rec-tab-${tab}`).classList.add('active');
    const content = document.getElementById('recruit-content');
    if (tab === 'board') {
      const uncommitted = G.recruits.filter(r => !r.recruitingData.committed).sort((a, b) => b.starRating - a.starRating || b.overall - a.overall);
      content.innerHTML = this.renderRecruitBoard(uncommitted.slice(0, 50));
    } else if (tab === 'targets') {
      const myTargets = G.recruits.filter(r => r.recruitingData.interest[G.coach.school] !== undefined && !r.recruitingData.committed);
      content.innerHTML = this.renderRecruitBoard(myTargets);
    } else if (tab === 'committed') {
      const committed = G.recruits.filter(r => r.recruitingData.committedTo === G.coach.school);
      content.innerHTML = `
        <div class="card">
          <div class="card-title">Your Committed Recruits</div>
          ${committed.length === 0 ? '<p class="text-sm">No commitments yet</p>' : ''}
          ${committed.map(r => `
            <div class="recruit-card">
              <div class="flex-between">
                <div><strong>${r.name}</strong> <span class="star">${Utils.stars(r.starRating)}</span></div>
                <span class="badge badge-green">COMMITTED</span>

              <div class="text-sm">${r.position} | ${r.archetype} | ${r.hometown} | OVR: ${r.overall}</div>
            </div>
          `).join('')}
        </div>`;
    }

  renderRecruitBoard(recruits) {
    return `
      <div class="scroll-y" style="max-height:600px;">
        <table>
          <tr><th>Name</th><th>Stars</th><th>Pos</th><th>OVR</th><th>Hometown</th><th>Interest</th><th>Status</th><th>Actions</th></tr>
          ${recruits.map(r => {
            const interest = r.recruitingData.interest[G.coach.school];
            const hasOffered = interest !== undefined;
            return `
              <tr>
                <td><strong>${r.name}</strong><br><span class="text-sm">${r.archetype}</span></td>
                <td class="star">${Utils.stars(r.starRating)}</td>
                <td>${r.position}</td>
                <td>${r.overall}</td>
                <td class="text-sm">${r.hometown}</td>
                <td>
                  ${hasOffered ? `
                    <div class="interest-bar" style="width:80px;">
                      <div class="interest-fill" style="width:${interest}%"></div>
                    </div>
                    <span class="text-sm">${interest}/100</span>
                  ` : '<span class="text-sm">—</span>'}
                </td>
                <td>${r.recruitingData.committed ? `<span class="badge badge-green">${r.recruitingData.committedTo}</span>` : '<span class="badge badge-navy">Open</span>'}</td>
                <td>
                  ${!r.recruitingData.committed ? `

                        <button class="btn-sm btn-secondary" onclick="UIEngine.recruitAction('${r.id}','campusVisit')">Campus</button>
                        <button class="btn-sm btn-primary" onclick="UIEngine.recruitAction('${r.id}','nilPitch')">NIL</button>
                      </div>
                    `}
                  ` : ''}
                </td>
              </tr>`;
          }).join('')}
        </table>
      </div>`;
  },

  recruitAction(recruitId, action) {
    const recruit = G.recruits.find(r => r.id === recruitId);

    const prog = G.programs.find(p => p.name === G.coach.school);
    RecruitingEngine.doRecruitAction(recruit, G.coach.school, action, G.coach.skills.recruiting, prog);
    GameEngine.save();
    this.render('recruiting');

                <span style="width:24px;text-align:right;">${skills[k]}</span>

        </div>

                <span class="badge badge-navy">${a.role}</span>

              <div class="text-sm mt-8">

                  <div>Development: ${a.skills.development}</div>

                  <div>Charisma: ${a.skills.charisma}</div>
                  <div>Loyalty: ${a.skills.loyalty}</div>
                  <div>Ambition: ${a.ambition}</div>

  },

  addSkillPoint(skill) {
    if (G.coach.skillPoints > 0 && G.coach.skills[skill] < 99) {
      G.coach.skills[skill] = Math.min(99, G.coach.skills[skill] + 1);
      G.coach.skillPoints--;
      GameEngine.save();
      this.render('staff');
    }
  },

  fireAssistant(idx) {
    const prog = G.programs.find(p => p.name === G.coach.school);
    if (prog && prog.assistants[idx]) {
      GameEngine.addNews(`${prog.assistants[idx].name} has been dismissed from the coaching staff.`, 'coaching');
      prog.assistants.splice(idx, 1);
      GameEngine.save();
      this.render('staff');
    }
  },

  changeAssistantRole(idx, role) {
    const prog = G.programs.find(p => p.name === G.coach.school);
    if (prog && prog.assistants[idx] && role) {
      prog.assistants[idx].role = role;
      GameEngine.save();
      this.render('staff');
    }
  },

  hireAssistant() {
    const prog = G.programs.find(p => p.name === G.coach.school);
    if (!prog || prog.assistants.length >= 3) return;
    const newAsst = {
      id: Utils.uuid(), name: NameGen.genCoachName(),
      role: 'Recruiting Coordinator',
      skills: { recruiting: Utils.rand(25, 65), development: Utils.rand(25, 65), schemeKnowledge: Utils.rand(25, 65), charisma: Utils.rand(30, 70), loyalty: Utils.rand(30, 80) },
      ambition: Utils.rand(20, 80), salary: Utils.rand(50000, 200000), yearsWithTeam: 0
    };
    prog.assistants.push(newAsst);
    GameEngine.addNews(`${newAsst.name} hired as ${newAsst.role}.`, 'coaching');
    GameEngine.save();
    this.render('staff');
  },

    const cats = [

  // === SCHEDULE ===
  renderSchedule(el) {
    const myGames = G.schedule.filter(s => s.home === G.coach.school || s.away === G.coach.school);
    myGames.sort((a, b) => a.week - b.week);

    el.innerHTML = `

      <div class="card">
        <div class="scroll-y" style="max-height:600px;">
          <table>
            <tr><th>Week</th><th>Opponent</th><th>Type</th><th>Result</th><th>Details</th></tr>
            ${myGames.map(g => {
              const isHome = g.home === G.coach.school;
              const opp = isHome ? g.away : g.home;
              const r = g.result;
              let resultText = '', won = false;
              if (r) {
                const myScore = isHome ? r.homeScore : r.awayScore;
                const oppScore = isHome ? r.awayScore : r.homeScore;
                won = (isHome && r.homeWin) || (!isHome && !r.homeWin);
                resultText = `${won ? 'W' : 'L'} ${myScore}-${oppScore}`;
              }
              return `<tr style="${g.week === G.week ? 'background:rgba(232,96,28,.1);' : ''}">

                <td>${isHome ? 'vs' : '@'} <strong>${opp}</strong></td>
                <td><span class="badge ${g.type === 'conference' ? 'badge-navy' : 'badge-orange'}">${g.type === 'conference' ? 'CONF' : 'NC'}</span></td>
                <td>${r ? `<span style="color:${won ? 'var(--green)' : 'var(--red)'}; font-weight:600;">${resultText}</span>` : '—'}</td>
                <td>${r ? `<button class="btn-sm btn-secondary" onclick="UIEngine.showGameDetail(${myGames.indexOf(g)})">Box Score</button>` : ''}</td>

        </div>
      </div>
      ${G.ncaaBracket ? `
        <div class="card mt-16">
          <div class="card-title">NCAA Tournament</div>
          ${G.ncaaBracket.champion ? `<p style="font-size:18px;color:var(--navy);font-weight:700;">${G.ncaaBracket.champion} wins the National Championship!</p>` : '<p>Tournament in progress...</p>'}
        </div>
      ` : ''}`;
  },

            </div>
          </div>

  showNatTab(tab) {
    document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));

    if (tab === 'standings') {
      let html = '<div class="grid-2">';
      for (const conf of SchoolData.conferences) {

        html += `<div class="card"><div class="card-title">${conf.name}</div><table><tr><th>Team</th><th>Conf</th><th>Overall</th></tr>
          ${teams.map(t => `<tr style="${t.name === G.coach.school ? 'font-weight:600;color:var(--orange);' : ''}"><td>${t.name}</td><td>${t.confWins}-${t.confLosses}</td><td>${t.wins}-${t.losses}</td></tr>`).join('')}
        </table></div>`;
      }
      html += '</div>';
      content.innerHTML = html;
    } else if (tab === 'leaders') {
      const allP = G.players.filter(p => p.stats.gp >= 3).sort((a, b) => b.stats.ppg - a.stats.ppg);
      content.innerHTML = `
        <div class="grid-2">
          <div class="card"><div class="card-title">Scoring Leaders</div><table><tr><th>#</th><th>Player</th><th>School</th><th>PPG</th></tr>
